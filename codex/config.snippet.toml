# ai-workspace — Codex CLI settings. The [mcp_servers.*] blocks go into ~/.codex/config.toml (merged) and into
# <repo>/.codex/config.toml (written, like .mcp.json for Claude). Codex loads a repo file only when that repo is trusted.
# Keep each server block free of blank lines - the bootstraps cut blocks at blank lines.

# Jira + Confluence (ISOS tenant) — HTTP MCP with OAuth: after adding, run `codex mcp login atlassian-isos`
[mcp_servers.atlassian-isos]
url = "https://mcp.atlassian.com/v1/mcp"

# Real browser for verification on SIT/UAT
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

# Sandbox + approvals: the agent may edit files in the workspace and reach the network (MCP, aws, tunnels);
# anything outside the workspace, and every command the sandbox cannot run, is prompted.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = true
